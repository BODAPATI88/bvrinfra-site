apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-api
  namespace: bvrinfra
  labels:
    app: metrics-api
    app.kubernetes.io/part-of: bvrinfra-portfolio
  annotations:
    # ArgoCD: force sync when image changes even if tag is the same
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: metrics-api
        app.kubernetes.io/part-of: bvrinfra-portfolio
      annotations:
        # Force rollout on ConfigMap change (ArgoCD friendly)
        checksum/config: "placeholder-updated-by-kustomize-or-helm"
    spec:
      # ---------------------------------------------------------------
      # Security context: drop all capabilities, read-only root fs
      # ---------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: metrics-api
          # Replace with your registry + image after pushing
          image: docker.io/library/metrics-api:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: metrics-api-config

          # If you use a token to authenticate against Prometheus, uncomment:
          # env:
          #   - name: PROMETHEUS_TOKEN
          #     valueFrom:
          #       secretKeyRef:
          #         name: metrics-api-secret
          #         key: prometheus-token

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # Temp dir needed by gunicorn
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # ---------------------------------------------------------------
          # Probes
          # ---------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 5

          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            failureThreshold: 10
            periodSeconds: 3

          # ---------------------------------------------------------------
          # Resources: lightweight — this is a small proxy, not a compute job
          # ---------------------------------------------------------------
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"

      volumes:
        - name: tmp
          emptyDir: {}

      # Allow the pod to resolve internal cluster DNS for Prometheus
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      restartPolicy: Always
